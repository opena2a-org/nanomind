name: Release nanomind-analyst

# Triggered by pushing a `nanomind-analyst-v<version>` tag. The npm packages in
# this monorepo use prefixed tags too (cli-v*, daemon-v*, router-v*) so this
# pattern composes cleanly without colliding.
on:
  push:
    tags:
      - 'nanomind-analyst-v*'

permissions:
  # Required for PyPI Trusted Publishing (OIDC).
  id-token: write
  # gh release create on the same job.
  contents: write

jobs:
  pre-publish-smoke:
    # Hard gate for PyPI publish. Builds the wheel, installs it into a fresh
    # macOS-arm64 venv with all declared deps resolved (NO --no-deps), and
    # runs the daemon-boot smoke that exercises the exact
    # `from_pretrained(..., device_map=...)` call the daemon makes. Catches
    # any missing-runtime-dep regression on the inference path before it can
    # reach end users. Added 2026-05-13 after v0.1.0 shipped without
    # `accelerate` declared and `nanomind-analyst install` crashed at boot on
    # every clean env.
    name: Pre-publish boot smoke (clean macos-arm64 venv)
    runs-on: macos-14
    defaults:
      run:
        working-directory: packages/nanomind-analyst
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip build

      - run: python -m build --wheel

      - name: Install wheel into fresh venv WITH all declared deps
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl pytest pytest-mock

      - name: Run boot smoke against installed wheel
        run: |
          set -euo pipefail
          /tmp/smoke-venv/bin/python -m pytest tests/test_install_smoke.py -v -m smoke

  build-and-publish:
    name: Build wheel + publish to PyPI via OIDC
    needs: pre-publish-smoke
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: packages/nanomind-analyst
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for the merge-base check below

      # Refuse to publish unless the tag points at a commit that is on main.
      # Tags are pushable from any branch by anyone with repo write access;
      # this gate forces every release to come from a reviewed merged commit.
      - name: Refuse if tag is not on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::tag ${{ github.ref_name }} (sha ${{ github.sha }}) is not an ancestor of origin/main"
            echo "Releases must come from commits merged into main."
            exit 1
          fi
          echo "tag commit ${{ github.sha }} is on main ✓"

      - name: Refuse if pyproject version does not match tag
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#nanomind-analyst-v}"
          # working-directory is packages/nanomind-analyst (job defaults), so
          # the path is relative to that. The previous prefix
          # 'packages/nanomind-analyst/pyproject.toml' double-nested into
          # 'packages/nanomind-analyst/packages/nanomind-analyst/...' and
          # threw FileNotFoundError before the v0.1.2 publish could run.
          PYPROJECT_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag version $TAG_VERSION does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi
          echo "tag version $TAG_VERSION matches pyproject.toml ✓"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Sanity-check wheel contents
        run: |
          set -euo pipefail
          WHL=$(ls dist/*.whl | head -1)
          echo "Built: $WHL"
          python -m zipfile -l "$WHL" | tee /tmp/wheel.txt
          grep "input-classifier-v1/classifier.joblib" /tmp/wheel.txt
          grep "input-classifier-v1/meta.json" /tmp/wheel.txt

      # Idempotent guard: if the target version is already on PyPI (e.g. tag
      # re-push), skip publish rather than failing the job.
      - name: Skip if version already on PyPI
        id: check-version
        run: |
          set -euo pipefail
          VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sI "https://pypi.org/simple/nanomind-analyst/$VERSION/" | head -1 | grep -q '200'; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI via Trusted Publishing (OIDC)
        if: steps.check-version.outputs.already_published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/nanomind-analyst/dist
          attestations: true

      - name: Create GitHub release
        if: steps.check-version.outputs.already_published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # working-directory is packages/nanomind-analyst (job defaults), so
          # the dist/* glob is relative to that. Previous `packages/nanomind-analyst/dist/*`
          # double-nested and emitted "no matches found" after the PyPI publish
          # had already succeeded (v0.1.2 release, 2026-05-14).
          gh release create "${{ github.ref_name }}" \
            --title "nanomind-analyst ${{ steps.check-version.outputs.version }}" \
            --notes "Published to PyPI via Trusted Publishing (OIDC). Verify provenance: \`python -m pip download nanomind-analyst==${{ steps.check-version.outputs.version }} --no-deps\` and inspect attestations at https://pypi.org/project/nanomind-analyst/${{ steps.check-version.outputs.version }}/#files." \
            dist/*
