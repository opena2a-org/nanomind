name: CI

# Runs on EVERY PR to main (no workflow-level paths filter) so the aggregate
# "CI Gate" check always reports a status and can be a required check without
# wedging PRs that don't touch code (a path-filtered required check would sit
# forever on "Expected — waiting for status"). Relevant-path detection is done
# in the `changes` job; the expensive jobs are skipped when nothing relevant
# changed, and `CI Gate` treats a skip as a pass.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read  # dorny/paths-filter lists PR files via the API on pull_request events

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'integrations/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'

  build-and-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        timeout-minutes: 5

  pack-smoke:
    name: Pack smoke (publish surface non-empty)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: npm pack --dry-run on each publishable workspace
        run: |
          set -e
          fail=0
          for ws in \
            packages/nanomind-atc \
            packages/nanomind-cli \
            packages/nanomind-daemon \
            packages/nanomind-engine \
            packages/nanomind-guard \
            packages/nanomind-router \
            packages/nanomind-runtime-core \
            integrations/hma \
            integrations/opena2a \
            integrations/secretless-ai; do
            if [ ! -d "$ws" ]; then
              echo "::notice::$ws does not exist — skipping"
              continue
            fi
            name=$(node -p "require('./$ws/package.json').name")
            private=$(node -p "require('./$ws/package.json').private===true")
            if [ "$private" = "true" ]; then
              echo "::notice::$ws ($name) is private — skipping"
              continue
            fi
            files=$(npm --workspace="$ws" pack --dry-run --json 2>/dev/null | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(d[0].files.length)")
            if [ -z "$files" ] || [ "$files" = "0" ]; then
              echo "::error::$ws ($name) packs to an EMPTY tarball — add files[] or fix build"
              fail=1
            else
              echo "$ws ($name): $files files"
            fi
          done
          exit $fail
        timeout-minutes: 3

  # Aggregate gate — the single required check for branch protection. Always
  # runs (even when the jobs above are skipped) so it reports on every PR. It
  # fails only if a job that actually ran failed or was cancelled; a skipped
  # job (no relevant changes) counts as a pass.
  ci-gate:
    name: CI Gate
    needs: [changes, build-and-test, pack-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          ch='${{ needs.changes.result }}'
          bt='${{ needs.build-and-test.result }}'
          ps='${{ needs.pack-smoke.result }}'
          echo "changes=$ch  build-and-test=$bt  pack-smoke=$ps"
          # Change-detection MUST succeed; otherwise the build/test jobs are
          # skipped for the wrong reason and a code change could slip through
          # untested. Fail closed.
          if [ "$ch" != "success" ]; then
            echo "::error::change-detection job did not succeed ($ch); failing closed."
            exit 1
          fi
          for r in "$bt" "$ps"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass ($r)."
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped (no relevant changes)."
