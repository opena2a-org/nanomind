name: CI nanomind-analyst

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/nanomind-analyst/**'
      - '.github/workflows/ci-nanomind-analyst.yml'

concurrency:
  group: ci-nanomind-analyst-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python }})
    runs-on: macos-14  # Apple Silicon runner; matches the install platform.
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: packages/nanomind-analyst
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # Install in editable mode WITHOUT the heavy ML deps (torch,
          # transformers, sentence-transformers) — they aren't needed for the
          # unit-test surface we exercise here and would balloon CI to 10+ min.
          # The test suite stubs out all model loading.
          python -m pip install --no-deps -e .
          # huggingface_hub WITH transitive deps (httpx, tqdm, etc) so its
          # snapshot_download submodule is importable. test_artifacts uses an
          # injected fake downloader, so HF itself does not need to function.
          python -m pip install pytest pytest-mock huggingface_hub joblib

      - name: Run pytest
        run: python -m pytest -v

  build-wheel:
    name: Build wheel (smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nanomind-analyst
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip build

      - run: python -m build --wheel

      - name: Verify wheel contents include classifier artifacts
        run: |
          set -euo pipefail
          WHL=$(ls dist/*.whl | head -1)
          python -m zipfile -l "$WHL" | tee /tmp/wheel.txt
          grep "input-classifier-v1/classifier.joblib" /tmp/wheel.txt
          grep "input-classifier-v1/meta.json" /tmp/wheel.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: packages/nanomind-analyst/dist/*.whl

  wheel-install-smoke:
    # Regression gate for the v0.1.0 dep-omission incident (missing
    # `accelerate`). Installs the built wheel into a FRESH venv with all
    # declared deps resolved (NO --no-deps shortcut) and exercises the exact
    # `from_pretrained(..., device_map=...)` call shape the daemon uses, via a
    # 5 MB stand-in model. If a future change drops a runtime dep that the
    # inference path needs, this job fails before the wheel reaches PyPI.
    name: Wheel install + boot smoke (clean venv)
    needs: build-wheel
    runs-on: macos-14
    defaults:
      run:
        working-directory: packages/nanomind-analyst
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: packages/nanomind-analyst/dist

      - name: Install wheel into fresh venv WITH all declared deps
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke-venv
          # Resolve ALL declared deps from pyproject.toml. No --no-deps. This
          # is the path a brand-new user takes via `pip install nanomind-analyst`.
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl pytest pytest-mock

      - name: Run smoke tests against installed wheel
        run: |
          set -euo pipefail
          # Run smoke markers ONLY; the rest of the suite runs in the matrix
          # test job above and is already covered there.
          /tmp/smoke-venv/bin/python -m pytest tests/test_install_smoke.py -v -m smoke
