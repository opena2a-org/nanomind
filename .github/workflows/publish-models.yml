name: Validate Model Manifest

# Models are published to HuggingFace MANUALLY via `hf upload` from the private
# training tree (`training/` is gitignored in this public repo, so the HF push
# script cannot run in CI). This workflow therefore validates the manifest on
# every change; it does not publish. The prior auto-publish job referenced
# `training/scripts/push-to-huggingface.py`, which has never existed in the
# public checkout and failed on every run.
#
# Manual publish procedure: see nanomind-training/RUNBOOK_UPDATE_MODEL.md Step 6
# (`npx secretless-ai run --only HUGGIN_KEY -- make publish MODEL_VERSION=<v>`).

on:
  push:
    branches: [main]
    paths:
      - 'nanomind-models.json'
  pull_request:
    paths:
      - 'nanomind-models.json'
  workflow_dispatch:

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate manifest is well-formed JSON
        run: python -c "import json; json.load(open('nanomind-models.json'))"

      - name: Validate manifest invariants
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open('nanomind-models.json'))
          errs = []
          for name, model in m.get('models', {}).items():
              versions = model.get('versions', {})
              latest = model.get('latestVersion')
              if versions and latest and latest not in versions:
                  errs.append(f"{name}: latestVersion {latest} not in versions")
              latest_count = sum(1 for v in versions.values() if v.get('status') == 'latest')
              if versions and latest_count != 1:
                  errs.append(f"{name}: expected exactly 1 'latest' version, found {latest_count}")
          if errs:
              print("\n".join(errs)); sys.exit(1)
          print("manifest invariants OK")
          PY
